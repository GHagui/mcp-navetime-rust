[package]
name = "navitime-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server for Japan transit route search via Navitime API"
repository = "https://github.com/GHagui/mcp-navitime-rust"
license = "MIT"
keywords = ["mcp", "navitime", "transit", "japan", "route-search"]
categories = ["command-line-utilities"]

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
mockall = "0.13"
